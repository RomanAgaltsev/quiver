version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: qv
    main: ./cmd/qv
    binary: qv
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      # Same variable the Taskfile stamps, so `qv --version` reports the same
      # thing however the binary was produced.
      - -s -w -X github.com/RomanAgaltsev/quiver/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
