# Desired state for this repository's settings on the remote host.
#
# Apply it with:   keel settings apply
# Check for drift: keel settings apply --check
#
# Only the keys named here are converged; anything omitted is left alone, so this
# file is safe to run against a repo you have also tuned by hand.
#
# A required check that never reports blocks every pull request, and an action
# that is not permitted never starts at all — so the two lists below are the
# load-bearing ones. Each required check names a *job* that exists in
# .github/workflows and whose name does not change when a matrix does.
version: 1

repository:
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_auto_merge: true
  delete_branch_on_merge: true
  has_wiki: false
  has_projects: false

security:
  dependency_graph: true
  dependabot_alerts: true
  dependabot_security_updates: true
  # Secret scanning is unavailable on private repos without GitHub Advanced
  # Security, so it is declared only because this repo is public.
  secret_scanning: true
  secret_scanning_push_protection: true
  private_vulnerability_reporting: true

actions:
  allowed: local_and_verified
  allowed_patterns:
    - amannn/action-semantic-pull-request@*
    - crate-ci/typos@*
    - docker://rhysd/actionlint
    - golangci/golangci-lint-action@*
    - googleapis/release-please-action@*
    - goreleaser/goreleaser-action@*
  default_workflow_permissions: read
  # release-please cannot open its release PR without this.
  can_approve_pull_request_reviews: true

rulesets:
  - name: "keel: main"
    target: branch
    ref: main
    required_status_checks:
      - actionlint
      - build
      - codeql
      - coverage
      - dependency-review
      - example
      - govulncheck
      - lint
      - pr-title
      - test
      - typos
    required_approving_reviews: 0
    required_linear_history: true
    block_force_push: true
    block_deletion: true
    bypass:
      - repo_admin
