version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty
  LDFLAGS: -X github.com/RomanAgaltsev/quiver/internal/cli.Version={{.VERSION}}

tasks:
  build:
    desc: Build ./qv with the version stamped in.
    cmds: ['go build -ldflags "{{.LDFLAGS}}" -o qv ./cmd/qv']

  test:
    desc: >-
      Fast local tests. -race needs a C toolchain, which Windows lacks by
      default, so the race build lives in its own task and CI.
    cmds: ['go test -shuffle=on ./...']

  test:race:
    desc: What CI runs. Needs gcc/clang (MSYS2, TDM-GCC) on Windows.
    cmds: ['go test -race -shuffle=on ./...']

  test:binary:
    desc: >-
      Workaround for machines whose antivirus blocks executing a test binary out
      of the temp directory ("Access is denied" from fork/exec). Builds each
      package's test binary into ./bin and runs it from there.
    cmds:
      - go test -c -o bin/{{.PKG}}.test.exe ./internal/{{.PKG}}
      - ./bin/{{.PKG}}.test.exe
    requires:
      vars: [PKG]

  cover:
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    cmds: ['golangci-lint run']

  fmt:
    cmds: ['golangci-lint fmt']

  typos:
    desc: >-
      Spell-check the repository, the same gate CI runs. Install once:
      `winget install Crate-CI.Typos` (Windows), `brew install typos-cli` (macOS),
      or `cargo install typos-cli`.
    cmds: ['typos']
    preconditions:
      - sh: typos --version
        msg: >-
          typos is not installed, so this check cannot run. It is NOT optional:
          CI runs it and a single misspelled word in a comment fails the build
          after you have already pushed. Install it with
          `winget install Crate-CI.Typos`, `brew install typos-cli`, or
          `cargo install typos-cli`.

  proto:
    desc: Regenerate the gRPC test fixtures (needs protoc + protoc-gen-go + protoc-gen-go-grpc).
    cmds:
      - >-
        protoc --go_out=. --go_opt=module=github.com/RomanAgaltsev/quiver
        --go-grpc_out=. --go-grpc_opt=module=github.com/RomanAgaltsev/quiver
        internal/transport/grpcx/testdata/echo.proto

  vuln:
    cmds: ['go run golang.org/x/vuln/cmd/govulncheck@latest ./...']

  ci:
    desc: >-
      The local gate, as close to CI as a workstation gets. CI additionally runs
      -race on three OSes, CodeQL, actionlint and dependency-review.
    cmds:
      - task: fmt
      - task: lint
      # typos runs before the slow jobs: it takes under a second, and it is the
      # gate that used to fail only AFTER a push, twice in a row, both times on
      # one word in a comment.
      - task: typos
      - task: test
      - task: vuln

  tidy:
    cmds: ['go mod tidy']

  example:
    desc: Run the hermetic example collection against the local example server.
    cmds:
      - go run ./examples/local/server &
      - sleep 2
      - go run ./cmd/qv run examples/local/requests/ --env dev

  example:load:
    desc: >-
      Run the hermetic load example. Assumes the example server is already up
      (`go run ./examples/local/server &`).
    cmds:
      - >-
        go run ./cmd/qv load examples/local/load/get-users.yaml
        --setup examples/local/requests/ --env dev
