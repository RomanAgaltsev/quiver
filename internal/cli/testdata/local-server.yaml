openapi: 3.1.0
info:
  title: Quiver example server
  version: "1.0"
  description: >-
    Describes exactly what examples/local/server/app serves, so a collection
    generated from it has something real to run against.
servers:
  - url: http://127.0.0.1:0
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /login:
    post:
      operationId: login
      tags: [auth]
      responses:
        "200":
          description: a bearer token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
  /me:
    get:
      operationId: getMe
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: the signed-in user
          content:
            application/json:
              schema:
                type: object
                required: [name, login]
                properties:
                  name:
                    type: string
                  login:
                    type: string
  /users:
    get:
      operationId: listUsers
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: every user
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      type: object
