openapi: 3.1.0
info:
  title: Security
  version: "1.0"
servers:
  - url: https://api.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Development token: literal-token-value"
    basicAuth:
      type: http
      scheme: basic
      description: "Sign in as admin / hunter2"
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Example key: s3cr3t"
    queryKeyAuth:
      type: apiKey
      in: query
      name: api_key
    oauth2Auth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://api.example.com/token
          scopes:
            read: read everything
paths:
  /ping:
    get:
      operationId: ping
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ok
