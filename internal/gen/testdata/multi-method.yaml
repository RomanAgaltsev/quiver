openapi: 3.1.0
info:
  title: Multi
  version: "1.0"
servers:
  - url: https://api.example.com
paths:
  /pets:
    get:
      operationId: listPets
      tags: [pets]
      responses:
        "200":
          description: ok
    post:
      operationId: createPet
      tags: [pets]
